<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <title>Settings</title>
</head>

<body>
    <header class="navbar">
        <a href="{{ url_for('index') }}" class="nav-link">Back to Timer</a>
        <div class="logout-section">
            <a href="{{ url_for('profile') }}">
                <img src="{{ url_for('static', filename='profilePictures/' + session.get('profile_pic', 'default.png')) }}"
                    alt="Profile Picture" class="profile-icon">
            </a>
            <a href="{{ url_for('settings') }}" class="nav-link">Settings</a>
            <a href="{{ url_for('logout') }}" class="logout-button">
                <i class="fas fa-door-open"></i> Log out
            </a>
        </div>
    </header>
    <main>
        <form method="POST" class="settings_form">
            <h2>Settings</h2>
            <label for="work_time">Work Time (minutes):</label>
            <input type="number" name="work_time" value="{{ work_time }}" min="1">
            <label for="break_time">Break Time (minutes):</label>
            <input type="number" name="break_time" value="{{ break_time }}" min="1">
            <button type="submit">Save</button>
        </form>
        <footer class="footer">
            <div class="footer-container">
                <div class="footer-nav">
                    <a href="{{ url_for('about_us') }}" class="footer-link">About Us</a>
                    <a href="{{ url_for('index') }}" class="footer-link">Timer</a>
                    <a href="{{ url_for('settings') }}" class="footer-link">Settings</a>
                    <a href="{{ url_for('profile') }}" class="footer-link">Profile</a>
                    <a href="{{ url_for('leaderboard') }}" class="footer-link">Leaderboard</a>
                </div>
                <p class="footer-text">&copy; 2025 Pomodoro App. All rights reserved.</p>
            </div>
        </footer>
    </main>
</body>

</html>
