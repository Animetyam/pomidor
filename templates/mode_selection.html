<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <title>Pomodoro</title>
    <script>
        function redirectSettings() {
            window.location.href = "{{ url_for('settings') }}";
        }
    </script>
    <script>
        function redirectIndex() {
            window.location.href = "{{ url_for('index') }}";
        }
    </script>
</head>

<body>
    <header class="navbar-timer">
        <div class="logout-section">
            <a href="{{ url_for('about_us') }}" class="nav-link" style="margin-right: 100px">About us</a>
            <a href="{{ url_for('profile') }}">
                <img src="{{ url_for('static', filename='profilePictures/' + session.get('profile_pic', 'default.png')) }}"
                    alt="Profile Picture" class="profile-icon">
            </a>
            <a href="{{ url_for('settings') }}" class="nav-link">Settings</a>
            <a href="{{ url_for('logout') }}" class="logout-button">
                <i class="fas fa-door-open"></i> Log out
            </a>
        </div>
    </header>
    <div class="mode-selection-container">
        <h2>Select Timer Mode</h2>
        <div class="mode-cards">
            <div class="mode-card" onclick="redirectIndex()">
                <h3>Low Energy</h3>
                <p>For a relaxed, calm session.</p>
            </div>
            <div class="mode-card" onclick="redirectIndex()">
                <h3>Full Energy</h3>
                <p>For a focused, high-energy session.</p>
            </div>
            <div class="mode-card" onclick="redirectSettings()">
                <h3>Custom Timer</h3>
                <p>For a focused, high-energy session.</p>
            </div>
        </div>
    </div>
    <footer class="footer">
        <p class="footer_text">&copy; 2025 Pomodoro App. All rights reserved.</p>
    </footer>
</body>
