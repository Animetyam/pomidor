<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <title>Pomodoro</title>
    <script>
        function redirectIndex(mode) {
            console.log('Функция вызвана с mode:', mode);
            const baseUrl = window.location.origin + "{{ url_for('index') }}"; // Абсолютный путь
            const url = new URL(baseUrl); // Создаем объект URL
            url.searchParams.set('mode', mode); // Добавляем параметр mode
            console.log('Новый URL:', url.href);
            window.location.href = url.href; // Перенаправляем пользователя
        }
    </script>
    <script> function redirectSettings() { window.location.href = "{{ url_for('settings') }}"; } </script>
</head>

<body>
    <header class="navbar-timer">
        <div class="logout-section">
            <a href="{{ url_for('profile') }}">
                <img src="{{ url_for('static', filename='profilePictures/' + session.get('profile_pic', 'default.png')) }}"
                    alt="Profile Picture" class="profile-icon">
            </a>
            <a href="{{ url_for('settings') }}" class="nav-link">Settings</a>
            <a href="{{ url_for('logout') }}" class="logout-button">
                <i class="fas fa-door-open"></i> Log out
            </a>
        </div>
    </header>
    <div class="mode-selection-container">
        <h2>Select Timer Mode</h2>
        <div class="mode-cards">
            <div class="mode-card" onclick="redirectIndex('low')">
                <h3>Low Energy</h3>
                <p>For a relaxed, calm session.</p>
            </div>
            <div class="mode-card" onclick="redirectIndex('full')">
                <h3>Full Energy</h3>
                <p>For a focused, high-energy session.</p>
            </div>
            <div class="mode-card" onclick="redirectSettings()">
                <h3>Custom Timer</h3>
                <p>For a focused, high-energy session.</p>
            </div>
        </div>
    </div>
    <footer class="footer">
        <div class="footer-container">
            <div class="footer-nav">
                <a href="{{ url_for('about_us') }}" class="footer-link">About Us</a>
                <a href="{{ url_for('index') }}" class="footer-link">Timer</a>
                <a href="{{ url_for('settings') }}" class="footer-link">Settings</a>
                <a href="{{ url_for('profile') }}" class="footer-link">Profile</a>
                <a href="{{ url_for('leaderboard') }}" class="footer-link">Leaderboard</a>
            </div>
            <p class="footer-text">&copy; 2025 Pomodoro App. All rights reserved.</p>
        </div>
    </footer>
</body>

</html>
