<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <title>Register</title>
</head>
<body>
    <form method="POST" enctype="multipart/form-data">
        <h2>Edit your profile</h2>
        <input type="password" name="password" placeholder="Password">
        <input type="password" name="confirm_password" placeholder="Confirm Password">
        <textarea name="about_me" placeholder="{{ session.get('about_me')}}"></textarea><br>
        <div class="avatar-upload">
            <img id="avatar" src="static/profilePictures/{{ session.get('profile_pic') }}" alt="ProfPic">
            <input type="file" id="file" name="profile_pic" accept=".png, .jpg">
            <label for="file">Uodate profile picture</label>
        </div><br>
        <button type="submit">Confirm changes</button>
        {% if error %}
            <p style="color: red">{{ error }}</p>
        {% endif %}
    </form>
    <a href="{{ url_for('login') }}">Login</a>
</body>
</html>
