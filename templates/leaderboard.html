<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <title>Leaderboard</title>
</head>

<body>
    {% if session.get('user')%} 
    <header class="navbar-timer">
        <div class="logout-section">
            <a href="{{ url_for('profile') }}">
                <img src="{{ url_for('static', filename='profilePictures/' + session.get('profile_pic', 'default.png')) }}"
                    alt="Profile Picture" class="profile-icon">
            </a>
            <a href="{{ url_for('settings') }}" class="nav-link">Settings</a>
            <a href="{{ url_for('logout') }}" class="logout-button">
                <i class="fas fa-door-open"></i> Log out
            </a>
        </div>
    </header>
    {% else %}
    <header class="navbar-timer">
        <div class="logout-section">
            <a href="{{ url_for('login') }}" class="logout-button">
                <i class="fas fa-door-closed"></i> Log in
            </a>
        </div>
    </header>
    {% endif %}
    <div class="leaderboard">
        <h2>🏆 Leaderboard</h2>
        <table>
            <thead>
                <tr>
                    <th>🏅 Rank</th>
                    <th>👤 Player</th>
                    <th>⏳ XP</th>
                </tr>
            </thead>
            <tbody id="leaderboard-body">
                {% for item in users %}
                <tr>
                    <td>{{ loop.index }}</td>
                    <td class="td_username"><img
                            src="{{ url_for('static', filename='profilePictures/' + item['profile_pic']) }}"
                            class="avatar"> {{ item['username'] }}</td>
                    <td>{{item['profile_xp']}}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>

    <footer class="footer">
        <div class="footer-container">
            <div class="footer-nav">
                <a href="{{ url_for('about_us') }}" class="footer-link">About Us</a>
                <a href="{{ url_for('index') }}" class="footer-link">Timer</a>
                <a href="{{ url_for('settings') }}" class="footer-link">Settings</a>
                <a href="{{ url_for('profile') }}" class="footer-link">Profile</a>
                <a href="{{ url_for('leaderboard') }}" class="footer-link">Leaderboard</a>
            </div>
            <p class="footer-text">&copy; 2025 Pomodoro App. All rights reserved.</p>
        </div>
    </footer>
</body>

</html>
