<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <title>Pomodoro Timer</title>
    <script>
        let workTime = {{ work_time | int }};
        let breakTime = {{ break_time | int }};
        let timer;
        let isWorkSession = true;
        let timeLeft;
        let totalTime = workTime * 60;
        let progressCircle;
        let circumference;


        function updateProgress() {
            if (!progressCircle) return;
            const progress = timeLeft / totalTime;
            progressCircle.style.strokeDashoffset = circumference * (1 - progress);

            if (isWorkSession) {
                progressCircle.style.stroke = "#FF5733";  // Например, красный для работы
            } else {
                progressCircle.style.stroke = "#4CAF50";  // Зеленый для перерыва
            }
        }

        function updateDisplay() {
            let minutes = Math.floor(timeLeft / 60);
            let seconds = timeLeft % 60;
            document.getElementById("timer").innerText = `${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;
            updateProgress();
        }

        function startTimer() {
            // Проверяем, запущен ли уже таймер
            if (timer) {
                return;
            }

            // Если timeLeft не инициализировано (первый запуск) или истекло, устанавливаем начальное значение
            if (typeof timeLeft === 'undefined' || timeLeft <= 0) {
                timeLeft = isWorkSession ? workTime * 60 : breakTime * 60;
                totalTime = timeLeft;
            }

            function updateTimer() {
                let minutes = Math.floor(timeLeft / 60);
                let seconds = timeLeft % 60;
                document.getElementById("timer").innerText = `${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;

                if (timeLeft <= 0) {
                    clearInterval(timer);
                    timer = null;

                    playSound();

                    if (isWorkSession) {
                        fetch('/update_streak', { method: 'POST' })
                            .then(response => response.text())
                            .then(data => console.log(data));
                    }

                    isWorkSession = !isWorkSession;
                    timeLeft = isWorkSession ? workTime * 60 : breakTime * 60; // Сбрасываем timeLeft при переключении сессии
                    totalTime = timeLeft;
                    startTimer();
                    return; // Важно выйти из функции, чтобы избежать двойного запуска
                }

                timeLeft--;
                updateDisplay();
            }

            updateTimer();
            timer = setInterval(updateTimer, 1000);

            document.getElementById('startBtn').disabled = true;
            document.getElementById('pauseBtn').disabled = false;
            document.getElementById('resetBtn').disabled = false;
        }

        function pauseTimer() {
            clearInterval(timer);
            timer = null;
            document.getElementById('pauseBtn').textContent = '▶ Resume Timer';
            document.getElementById('pauseBtn').onclick = resumeTimer;
        }

        function resumeTimer() {
            document.getElementById('pauseBtn').textContent = '⏸ Pause Timer';
            document.getElementById('pauseBtn').onclick = pauseTimer;
            startTimer();
        }

        function resetTimer() {
            clearInterval(timer);
            timer = null;
            isWorkSession = true;
            timeLeft = workTime * 60; // Сбрасываем timeLeft при сбросе таймера
            totalTime = timeLeft;

            updateDisplay(); // Обновляем отображение времени

            document.getElementById('startBtn').disabled = false;
            document.getElementById('pauseBtn').disabled = true;
            document.getElementById('resetBtn').disabled = true;
            document.getElementById('pauseBtn').textContent = '⏸ Pause Timer';
            document.getElementById('pauseBtn').onclick = pauseTimer;

            fetch('/reset_streak', { method: 'POST' })
                .then(response => response.text())
                .then(data => console.log(data));
        }


        function playSound() {
            const audio = new Audio('{{ url_for("static", filename="notification_sound.mp3") }}');
            audio.play();
            if (Notification.permission === "granted") {
                new Notification("Pomodoro Timer", {
                    body: isWorkSession ? "Work session is over!" : "Break is over!"
                });
            }
        }

        document.addEventListener("DOMContentLoaded", function () {
            if (Notification.permission !== "granted") {
                Notification.requestPermission();
            }

            progressCircle = document.querySelector(".progress-ring__progress");

            if (!progressCircle) {
                console.error("Ошибка: не найден progressCircle!");
                return;
            }

            const radius = progressCircle.r.baseVal.value;
            circumference = 2 * Math.PI * radius; // Длина окружности круга (r = 60)
            progressCircle.style.strokeDasharray = circumference;
            progressCircle.style.strokeDashoffset = circumference;

            timeLeft = workTime * 60; // Инициализируем timeLeft при загрузке страницы
            totalTime = timeLeft;
            updateDisplay(); // Обновляем отображение времени при загрузке страницы

            document.getElementById('pauseBtn').disabled = true;
            document.getElementById('resetBtn').disabled = true;


        });

        window.addEventListener("unload", function () {
            navigator.sendBeacon('/reset_streak', JSON.stringify({}));
        });
    </script>
</head>

<body>
    <header class="navbar-timer">
        <div class="logout-section">
            <a href="{{ url_for('profile') }}">
                <img src="{{ url_for('static', filename='profilePictures/' + session.get('profile_pic', 'default.png')) }}"
                    alt="Profile Picture" class="profile-icon">
            </a>
            <a href="{{ url_for('settings') }}" class="nav-link">Settings</a>
            <a href="{{ url_for('logout') }}" class="logout-button">
                <i class="fas fa-door-open"></i> Log out
            </a>
        </div>
    </header>
    <main>
        <div class="timer-container">
            <h2 class="timer_h2">Timer</h2>
            <div class="progress-ring">
                <svg width="300" height="300">
                    <circle class="progress-ring__background" cx="150" cy="150" r="120"></circle>
                    <circle class="progress-ring__progress" cx="150" cy="150" r="120"></circle>
                </svg>
                <span id="timer">25:00</span>
            </div>

            <div class="timer-button-container">
                <button id="startBtn" class="timer-button" onclick="startTimer()">▶ Start Timer</button>
                <button id="pauseBtn" class="timer-button" onclick="pauseTimer()" disabled>⏸ Pause</button>
                <button id="resetBtn" class="timer-button" onclick="resetTimer()" disabled>⏹ Reset Timer</button>
            </div>

            <div class="timer-description">
                <p>Focus on your task. Take a break once the timer runs out!</p>
            </div>
        </div>
        <footer class="footer">
            <div class="footer-container">
                <div class="footer-nav">
                    <a href="{{ url_for('about_us') }}" class="footer-link">About Us</a>
                    <a href="{{ url_for('index') }}" class="footer-link">Timer</a>
                    <a href="{{ url_for('settings') }}" class="footer-link">Settings</a>
                    <a href="{{ url_for('profile') }}" class="footer-link">Profile</a>
                    <a href="{{ url_for('leaderboard') }}" class="footer-link">Leaderboard</a>
                </div>
                <p class="footer-text">&copy; 2025 Pomodoro App. All rights reserved.</p>
            </div>
        </footer>
    </main>
</body>

</html>
