<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <title>Pomodoro Timer</title>
    <script>
        let workTime = {{ session.get('work_time', 25) }};
        let breakTime = {{ session.get('break_time', 5) }};
        let timer;
        let isWorkSession = true;

        function startTimer() {
            let timeLeft = isWorkSession ? workTime * 60 : breakTime * 60;
            timer = setInterval(function () {
                const minutes = Math.floor(timeLeft / 60);
                const seconds = timeLeft % 60;
                document.getElementById("timer").innerText = `${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;
                timeLeft--;

                if (timeLeft < 0) {
                    clearInterval(timer);
                    playSound();
                    isWorkSession = !isWorkSession;
                    startTimer();
                }
            }, 1000);
            document.getElementById('startBtn').disabled = true;
            document.getElementById('pauseBtn').disabled = false; // Активируем кнопку паузы
            document.getElementById('resetBtn').disabled = false;
        }

        function pauseTimer() {
            clearInterval(timer);
            isTimerRunning = false; // останавливаем таймер
            document.getElementById('pauseBtn').textContent = 'Resume Timer'; // Меняем текст на "Resume"
            document.getElementById('pauseBtn').disabled = false; // Блокируем кнопку паузы
            document.getElementById('startBtn').disabled = true;
        }

        function resetTimer() {
            clearInterval(timer);
            timeLeft = workTime * 60;
            document.getElementById('time').textContent = `${workTime}:00`;
            isTimerRunning = false; // останавливаем таймер
            document.getElementById('startBtn').textContent = 'Start Timer'; // Восстанавливаем начальный текст
            document.getElementById('resetBtn').disabled = true; // Блокируем кнопку сброса
            document.getElementById('pauseBtn').disabled = true; // Блокируем кнопку паузы
        }

        function playSound() {
            const audio = new Audio('{{ url_for("static", filename="notification_sound.mp3") }}');
            audio.play();
            if (Notification.permission === "granted") {
                new Notification("Pomodoro Timer", {
                    body: isWorkSession ? "Work session is over!" : "Break is over!"
                });
            }
        }

        document.addEventListener("DOMContentLoaded", function () {
            if (Notification.permission !== "granted") {
                Notification.requestPermission();
            }
        });

    </script>
</head>

<body>
    <header class="navbar-timer">
        <div class="logout-section">
            <a href="{{ url_for('profile') }}">
                <img src="{{ url_for('static', filename='profilePictures/' + session.get('profile_pic', 'default.png')) }}"
                    alt="Profile Picture" class="profile-icon">
            </a>
            <a href="{{ url_for('settings') }}" class="nav-link">Settings</a>
            <a href="{{ url_for('logout') }}" class="logout-button">
                <i class="fas fa-door-open"></i> Log out
            </a>
        </div>
    </header>
    <div class="timer-container">
        <h2>Timer</h2>
        <div class="timer">
            <span id="time">25:00</span> <!-- Таймер будет отображаться здесь -->
        </div>

        <div class="timer-button-container">
            <button id="startBtn" class="timer-button" onclick="startTimer()">Start Timer</button>
            <button id="pauseBtn" class="timer-button" onclick="pauseTimer()" disabled>Pause</button>
            <button id="resetBtn" class="timer-button" onclick="resetTimer()" disabled>Reset Timer</button>
        </div>

        <div class="timer-description">
            <p>Focus on your task. Take a break once the timer runs out!</p>
        </div>
    </div>
    <footer class="footer">
        <p class="footer_text">&copy; 2025 Pomodoro App. All rights reserved.</p>
    </footer>
</body>

</html>
