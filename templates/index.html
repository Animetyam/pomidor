<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <title>Pomodoro Timer</title>
    <script>
        let workTime = {{ work_time | int }};
        let breakTime = {{ break_time | int }};
        let timer;
        let isWorkSession = true;
        let timeLeft;
        let totalTime;
        let progressCircle;
        let circumference;
        let audio = new Audio('{{ url_for("static", filename="notification_sound.mp3") }}');
        audio.preload = 'auto';
        let lastTime = Date.now();

        function initTimer() {
            timeLeft = isWorkSession ? workTime * 60 : breakTime * 60;
            totalTime = timeLeft;
            updateDisplay();
        }

        function updateProgress() {
            if (!progressCircle) return;
            const progress = timeLeft / totalTime;
            progressCircle.style.strokeDashoffset = circumference * (1 - progress);
            progressCircle.style.stroke = isWorkSession ? "#FF5733" : "#4CAF50";
        }

        function updateDisplay() {
            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;
            document.getElementById("timer").innerText = `${minutes}:${seconds.toString().padStart(2, '0')}`;
            updateProgress();
        }

        function startTimer() {
            if (timer) return;

            initTimer();
            lastTime = Date.now();
            timer = setTimeout(tick, 1000);
            toggleButtons(true);
        }

        function tick() {
            const now = Date.now();
            const elapsed = (now - lastTime) / 1000;

            timeLeft = Math.max(0, timeLeft - Math.floor(elapsed));
            lastTime = now;
            updateDisplay();

            if (timeLeft <= 0) {
                handleComplete();
                return;
            }

            timer = setTimeout(tick, 1000);
        }

        function handleComplete() {
            clearTimeout(timer);
            timer = null;

            audio.play().catch(() => {});

            if (isWorkSession) {
                fetch('/update_streak', { method: 'POST' })
                    .then(response => response.text())
                    .then(data => console.log(data));
            }
            isWorkSession = !isWorkSession;
            initTimer();
            startTimer();
        }

        function pauseTimer() {
            clearTimeout(timer);
            timer = null;
            document.getElementById('pauseBtn').textContent = '▶ Resume';
            document.getElementById('pauseBtn').onclick = resumeTimer;
        }

        function resumeTimer() {
            lastTime = Date.now();
            timer = setTimeout(tick, 1000);
            document.getElementById('pauseBtn').textContent = '⏸ Pause';
            document.getElementById('pauseBtn').onclick = pauseTimer;
        }

        function resetTimer() {
            fetch('/reset_streak', { method: 'POST' })
                .then(response => response.text())
                .then(data => console.log(data));
            clearTimeout(timer);
            timer = null;
            isWorkSession = true;
            initTimer();
            toggleButtons(false);
        }

        function toggleButtons(running) {
            document.getElementById('startBtn').disabled = running;
            document.getElementById('pauseBtn').disabled = !running;
            document.getElementById('resetBtn').disabled = !running;
        }

        document.addEventListener("DOMContentLoaded", () => {
            Notification.requestPermission();

            progressCircle = document.querySelector(".progress-ring__progress");
            const radius = progressCircle.r.baseVal.value;
            circumference = 2 * Math.PI * radius;
            progressCircle.style.strokeDasharray = circumference;

            initTimer();
        });

        window.addEventListener("beforeunload", function (event) {
            if (navigator.sendBeacon) {
                navigator.sendBeacon('/reset_streak');
            }
            resetTimer();
        });
    </script>
</head>

<body>
    <header class="navbar-timer">
        <div class="logout-section">
            <a href="{{ url_for('profile') }}">
                <img src="{{ url_for('static', filename='profilePictures/' + session.get('profile_pic', 'default.png')) }}"
                    alt="Profile Picture" class="profile-icon">
            </a>
            <a href="{{ url_for('settings') }}" class="nav-link">Settings</a>
            <a href="{{ url_for('logout') }}" class="logout-button">
                <i class="fas fa-door-open"></i> Log out
            </a>
        </div>
    </header>
    <main>
        <div class="timer-container">
            <h2 class="timer_h2">Timer</h2>
            <div class="progress-ring">
                <svg width="300" height="300">
                    <circle class="progress-ring__background" cx="150" cy="150" r="120"></circle>
                    <circle class="progress-ring__progress" cx="150" cy="150" r="120"></circle>
                </svg>
                <span id="timer">25:00</span>
            </div>

            <div class="timer-button-container">
                <button id="startBtn" class="timer-button" onclick="startTimer()">▶ Start Timer</button>
                <button id="pauseBtn" class="timer-button" onclick="pauseTimer()" disabled>⏸ Pause</button>
                <button id="resetBtn" class="timer-button" onclick="resetTimer()" disabled>⏹ Reset Timer</button>
            </div>

            <div class="timer-description">
                <p>Focus on your task. Take a break once the timer runs out!</p>
            </div>
        </div>
        <footer class="footer">
            <div class="footer-container">
                <div class="footer-nav">
                    <a href="{{ url_for('about_us') }}" class="footer-link">About Us</a>
                    <a href="{{ url_for('index') }}" class="footer-link">Timer</a>
                    <a href="{{ url_for('settings') }}" class="footer-link">Settings</a>
                    <a href="{{ url_for('profile') }}" class="footer-link">Profile</a>
                    <a href="{{ url_for('leaderboard') }}" class="footer-link">Leaderboard</a>
                </div>
                <p class="footer-text">&copy; 2025 Pomodoro App. All rights reserved.</p>
            </div>
        </footer>
    </main>
</body>

</html>
